[project]
name = "context-layer"
version = "0.1.0"
description = "User-owned, portable personal context layer over mem0, exposed via MCP."
requires-python = ">=3.12,<3.14"
# mem0 is installed from the local clone (../mem0), see requirements.txt / README.
# mem0ai: locally uv resolves it from the ~/repos/mem0 editable clone via
# [tool.uv.sources] below; the Docker build uses pip, which ignores uv sources
# and installs mem0ai==2.0.12 from PyPI (identical version).
dependencies = [
    "mem0ai==2.0.12",
    "mcp>=1.2",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "fastembed>=0.4",             # ONNX embedder — light, used for deploy
    "psycopg[binary,pool]>=3.1",  # pgvector store on deploy
    "uvicorn>=0.30",              # streamable-http server
    "workos>=9,<10",              # OAuth: WorkOS AuthKit SDK (JWKS/base_url)
    "pyjwt[crypto]>=2.8",         # OAuth: verify WorkOS RS256 access tokens
]

[project.scripts]
context-layer = "context_layer.app:run"

[project.optional-dependencies]
# Local-dev stack (the defaults). NOT installed in the deploy image, which runs
# fastembed + pgvector. Keeps the container free of torch/chromadb.
local = [
    "sentence-transformers>=3.0",  # HuggingFace embedder
    "chromadb>=0.5",               # local embedded vector store
]

[tool.uv.sources]
# Local dev only — pip (Docker) ignores this and uses PyPI.
mem0ai = { path = "/Users/mei/repos/mem0", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_layer"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (the ruff default). I: import sorting.
# B: flake8-bugbear (likely-bug patterns). PT: flake8-pytest-style, which
# enforces our test conventions (test_*/Test*/conftest fixtures, assert style)
# so the naming/structure is linted, not just relied on by habit.
# UP (pyupgrade) is intentionally left off for now: it would rewrite the
# Optional[...] annotations that in-flight PRs (PER-5, PER-12) are editing —
# worth adopting once those land.
select = ["E", "F", "I", "B", "PT"]
