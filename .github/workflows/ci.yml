name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Mirrors the Dockerfile: mem0ai from PyPI, then this package's own
      # (lean) deps — no [local] extra, so no torch/chromadb in CI either.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "mem0ai==2.0.12" .
          pip install ruff pyright

      - name: ruff check
        run: ruff check .

      - name: pyright
        run: pyright src

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Base install (mem0ai + this package's lean deps) plus chromadb and
      # pytest. chromadb is the real local vector store the PER-5 isolation
      # test writes to; fastembed is already a core dependency, so on a cold
      # cache this hits huggingface.co for real — hosted runners have normal
      # internet access (unlike some sandboxed dev environments), so the
      # isolation test exercises the true default embedder end to end. The
      # PER-7 tests mock mem0.Memory.from_config and don't need a backend, so
      # a single job covers both.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "mem0ai==2.0.12" .
          pip install chromadb pytest

      - name: pytest
        run: pytest -v

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
