name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Mirrors the Dockerfile: mem0ai from PyPI, then this package's own
      # (lean) deps — no [local] extra, so no torch/chromadb in CI either.
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "mem0ai==2.0.12" .
          pip install ruff pyright

      - name: ruff check
        run: ruff check .

      - name: pyright
        run: pyright src

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # pytest gated on PER-7 (no test suite exists yet); add a `test` job here
  # once tests land, and make the PER-5 cross-tenant isolation test required.
