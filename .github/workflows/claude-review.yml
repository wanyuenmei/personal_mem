name: Claude Review

# Automated first-pass PR review. Runs on every PR update and posts its
# findings as inline comments on the relevant lines plus a summary comment,
# before a human looks at the diff.
#
# Inert until the owner enables it:
#   1. Add ANTHROPIC_API_KEY as a repo secret (Settings -> Secrets and
#      variables -> Actions).
#   2. Install the Claude GitHub App on the repo (`/install-github-app`, or
#      from the GitHub Marketplace).
# Without both, the job is skipped (see the `if` guard below) or no-ops.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel a superseded review when a newer push lands on the same PR, so rapid
# pushes don't pile up concurrent runs racing on the same review comment (and
# don't spend API budget reviewing a commit that's already been replaced).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege: read the code, comment on the PR. No write access to
# contents — the reviewer never pushes. id-token: write lets the action mint
# an OIDC token to exchange for the Claude GitHub App installation token.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip on forks — secrets aren't exposed to fork PRs.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    # Hoisted to job level so the step `if` can gate on it (secrets can't be
    # referenced directly in an `if`). Empty until the owner sets the secret.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        # No-op (green) until the key is wired up, instead of a red failure.
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Post a summary comment tracked across the run, plus inline
          # comments anchored to specific lines (see claude_args below).
          track_progress: true
          prompt: |
            Review this pull request thoroughly. Start from the whole change:
            run `git diff --stat` for the list of changed files and `git diff`
            for the full diff (the action gives you the exact base ref to diff
            against). Then go deeper than the diff itself — Read the changed
            files in full, and follow the change through the codebase: the
            callers and callees it touches, the tests that cover it, and any
            adjacent modules or invariants it could affect. Judge the change in
            the context of the code around it, not just the lines that changed.
            This is a static, read-only review: do NOT try to run the code —
            no scripts, tests, linters, or builds, and no other shell commands
            beyond `git diff`. Execution isn't available here; attempting it
            only burns your turn budget on denied commands without producing a
            review. Judge the code by reading it, not by running it.
            Leave feedback where it belongs: for anything tied to specific
            code, use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to comment on that exact file and line, so each
            point is anchored to the code it's about. Use the main review
            comment for the overall summary and anything not tied to one line.
            Focus on, in priority order:
            - Correctness: real bugs, unhandled errors, broken edge cases,
              concurrency and failure paths.
            - Tenant isolation & security: anything that could leak one
              user's memory to another, weaken the auth guards, or mishandle
              secrets/tokens. This is the product's core promise.
            - Tests: is new behavior covered, and do existing tests still hold?
            - Repo conventions in CLAUDE.md (PR-template sections, no milestone
              references, succinct history).
            Be concrete and cite file:line. Skip nits and style already
            enforced by ruff. If the PR looks good, say so briefly rather than
            inventing concerns.
          # claude_args (one flag per line; keep comments out of the block
          # scalar — lines under `claude_args: |` are passed verbatim as args):
          #  - allowed tools: read-only `git diff` (so the reviewer reads the
          #    whole diff at once) plus the inline-comment tool (so it can
          #    anchor findings to specific lines). Deny the git write verbs so
          #    a review can never mutate the repo; the job's contents:read
          #    token already blocks pushes — this keeps it explicit.
          #  - max-turns 30: enough for a deeper pass that reads beyond the
          #    diff (callers / callees / tests) while capping cost per run.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 30
            --allowedTools "Bash(git diff:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
