name: PR title

# Enforces the repo PR-title convention documented in CLAUDE.md and
# .github/pull_request_template.md:  "<ticket>: <short description>"
# e.g. "PER-7: add tests and tool error handling".
#
# Runs on `edited` too (not just opened/synchronize) so a title fixed after
# the fact re-checks without needing a new commit push.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        # The title is passed through an env var (never interpolated straight
        # into the shell) so a crafted PR title can't inject commands.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          if echo "$TITLE" | grep -Eq '^[A-Z][A-Z0-9]*-[0-9]+: .+'; then
            echo "OK: title matches '<ticket>: <short description>'."
          else
            echo "::error::PR title must be '<ticket>: <short description>' — a Linear id, a colon, a space, then a description. e.g. 'PER-7: add tests and tool error handling'. Got: '$TITLE'"
            exit 1
          fi
